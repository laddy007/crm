<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FF6B35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>KotloCRM</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0D0D0D; --surface: #181818; --surface2: #222;
      --border: #2C2C2C; --accent: #FF6B35; --text: #F0F0F0;
      --muted: #888; --danger: #EF5350;
    }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; -webkit-tap-highlight-color: transparent; user-select: none; }
    #app { height: 100%; display: flex; flex-direction: column; overflow: hidden; }

    /* LOADING */
    #loading { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 9999; }
    .loading-logo { font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 700; }
    .loading-logo b { color: var(--accent); }
    .loading-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: pulse 1s infinite ease-in-out; }
    @keyframes pulse { 0%,100%{opacity:.3;transform:scale(.8)} 50%{opacity:1;transform:scale(1)} }

    /* HEADER */
    .header { height: 56px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 8px; gap: 4px; flex-shrink: 0; }
    .header-title { flex: 1; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-size: 19px; font-weight: 700; letter-spacing: .5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header-title b { color: var(--accent); }
    .btn-icon { width: 44px; height: 44px; border-radius: 10px; border: none; background: transparent; color: var(--text); font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .btn-icon:active { background: var(--surface2); }
    .btn-icon.accent { color: var(--accent); }

    /* BREADCRUMB */
    .breadcrumb { padding: 7px 14px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .breadcrumb span { color: var(--muted); }
    .breadcrumb b { color: var(--text); }

    /* SCROLL */
    .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-bottom: 90px; }

    /* SEARCH */
    .search-bar { padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .search-wrap { position: relative; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .search-input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px 10px 38px; color: var(--text); font-family: inherit; font-size: 15px; outline: none; }
    .search-input:focus { border-color: var(--accent); }

    /* SECTION LABEL */
    .sec-label { padding: 18px 16px 6px; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }

    /* CARDS */
    .list { padding: 8px 14px; display: flex; flex-direction: column; gap: 8px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .card:active { border-color: var(--accent); background: var(--surface2); }
    .card-left { flex: 1; min-width: 0; }
    .card-title { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub   { color: var(--muted); font-size: 13px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-chev  { color: var(--muted); font-size: 20px; flex-shrink: 0; }
    .card-icon  { font-size: 22px; flex-shrink: 0; }

    /* status accent strips */
    .s-nova      { border-left: 3px solid #90CAF9; }
    .s-probiha   { border-left: 3px solid #FFAB76; }
    .s-dokoncena { border-left: 3px solid #A5D6A7; }
    .s-ceka      { border-left: 3px solid #FFE082; }

    /* DETAIL BLOCK */
    .detail-block { background: var(--surface); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-bottom: 4px; }
    .detail-row { display: flex; padding: 13px 16px; border-bottom: 1px solid var(--border); gap: 12px; align-items: flex-start; }
    .detail-row:last-child { border-bottom: none; }
    .d-label { width: 96px; color: var(--muted); font-size: 13px; flex-shrink: 0; padding-top: 1px; }
    .d-value { flex: 1; font-size: 15px; line-height: 1.5; word-break: break-word; }
    a { color: var(--accent); text-decoration: none; }

    /* BADGE */
    .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; flex-shrink: 0; }
    .badge-nova      { background:#1A2E4A; color:#90CAF9; }
    .badge-probiha   { background:#3A1E0A; color:#FFAB76; }
    .badge-dokoncena { background:#1A3320; color:#A5D6A7; }
    .badge-ceka      { background:#332E00; color:#FFE082; }

    /* PHOTOS */
    .photos-scroll { display: flex; gap: 8px; padding: 10px 14px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .photo-thumb { width: 82px; height: 82px; border-radius: 10px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--border); cursor: pointer; background: var(--surface2); }
    .photo-add { width: 82px; height: 82px; border-radius: 10px; border: 1.5px dashed var(--border); background: var(--surface2); color: var(--muted); font-size: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .photo-add:active { border-color: var(--accent); color: var(--accent); }
    .photo-edit-wrap { position: relative; flex-shrink: 0; }
    .photo-edit-thumb { width: 82px; height: 82px; border-radius: 10px; object-fit: cover; border: 1px solid var(--border); cursor: pointer; display: block; background: var(--surface2); }
    .photo-del { position: absolute; top: -5px; right: -5px; width: 22px; height: 22px; background: var(--danger); border-radius: 50%; border: 2px solid var(--bg); color: white; font-size: 11px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    /* FAB */
    .fab { position: fixed; bottom: 22px; right: 18px; width: 58px; height: 58px; background: var(--accent); border-radius: 18px; border: none; color: white; font-size: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 24px rgba(255,107,53,.45); transition: transform .1s; z-index: 100; }
    .fab:active { transform: scale(.9); }

    /* FORMS */
    .form-body { padding: 14px 14px 4px; display: flex; flex-direction: column; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
    .form-input, .form-textarea, .form-select { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-family: inherit; font-size: 15px; outline: none; width: 100%; }
    .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--accent); }
    .form-textarea { resize: vertical; min-height: 76px; }
    .form-select option { background: #222; }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }
    .btn-row { display: flex; gap: 8px; padding: 14px; }
    .btn-row .btn { flex: 1; }
    .btn { border: none; border-radius: 12px; padding: 14px 18px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity .12s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn:active { opacity: .72; }
    .btn-primary   { background: var(--accent); color: white; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-danger    { background: rgba(239,83,80,.12); color: var(--danger); border: 1px solid rgba(239,83,80,.25); }
    .btn-full      { width: calc(100% - 28px); margin: 0 14px 14px; }

    /* EMPTY */
    .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
    .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: .35; }
    .empty-title { font-size: 16px; color: var(--text); margin-bottom: 4px; }

    /* LIGHTBOX */
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.96); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .lightbox img { max-width: 100%; max-height: 100vh; object-fit: contain; }
    .lb-close { position: fixed; top: 16px; right: 16px; width: 44px; height: 44px; background: rgba(255,255,255,.1); border-radius: 50%; border: none; color: white; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* TOAST */
    .toast { position: fixed; bottom: 94px; left: 50%; transform: translateX(-50%); background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 9px 20px; border-radius: 20px; font-size: 14px; z-index: 500; white-space: nowrap; animation: fadeUp .2s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateX(-50%) translateY(8px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
    .price-accent { color: var(--accent); font-weight: 600; }

    /* BACKUP PANEL */
    .backup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 200; display: flex; align-items: flex-end; animation: fadeIn .15s; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .backup-sheet { background: var(--surface); border-radius: 20px 20px 0 0; width: 100%; padding: 0 0 32px; border-top: 1px solid var(--border); animation: slideUp .2s ease; }
    @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
    .backup-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 16px; }
    .backup-title { font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: .5px; padding: 0 20px 14px; border-bottom: 1px solid var(--border); }
    .backup-title span { color: var(--accent); }
    .backup-actions { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .backup-btn { display: flex; align-items: center; gap: 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; cursor: pointer; text-align: left; width: 100%; font-family: inherit; color: var(--text); }
    .backup-btn:active { border-color: var(--accent); }
    .backup-btn-icon { font-size: 26px; flex-shrink: 0; }
    .backup-btn-label { font-size: 15px; font-weight: 600; }
    .backup-btn-desc  { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .backup-info { margin: 0 14px; padding: 12px 14px; background: rgba(255,107,53,.08); border: 1px solid rgba(255,107,53,.2); border-radius: 10px; font-size: 13px; color: var(--muted); line-height: 1.5; }

    /* GDRIVE SETUP DIALOG */
    .gdrive-setup { position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadeIn .15s; }
    .gdrive-setup-box { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; width: 100%; max-width: 420px; padding: 24px 20px 20px; }
    .gdrive-setup-title { font-family: 'Barlow Condensed', sans-serif; font-size: 19px; font-weight: 700; letter-spacing: .5px; margin-bottom: 12px; }
    .gdrive-setup-title span { color: var(--accent); }
    .gdrive-setup-steps { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 16px; }
    .gdrive-setup-steps a { color: var(--accent); }
    .gdrive-setup-steps b { color: var(--text); }
    .gdrive-setup-input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; color: var(--text); font-family: inherit; font-size: 14px; outline: none; margin-bottom: 12px; }
    .gdrive-setup-input:focus { border-color: var(--accent); }
    .gdrive-setup-btns { display: flex; gap: 8px; }
    .gdrive-setup-btns .btn-prim { flex: 1; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 12px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
    .gdrive-setup-btns .btn-sec  { flex: 0 0 auto; background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; font-family: inherit; font-size: 15px; cursor: pointer; }
    .progress-bar-wrap { height: 3px; background: var(--border); border-radius: 2px; margin: 0 14px; overflow: hidden; }
    .progress-bar { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s; }

    /* BOTTOM NAV */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: var(--surface); border-top: 1px solid var(--border); display: flex; z-index: 90; flex-shrink: 0; }
    .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; border: none; background: transparent; color: var(--muted); font-family: inherit; font-size: 10px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; }
    .nav-tab.active { color: var(--accent); }
    .nav-tab-icon { font-size: 22px; line-height: 1; }

    /* CALENDAR */
    .cal-filters { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
    .cal-filter-row { display: flex; gap: 8px; }
    .cal-filter-select { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; color: var(--text); font-family: inherit; font-size: 13px; outline: none; min-width: 0; }
    .cal-filter-select:focus { border-color: var(--accent); }
    .cal-filter-select option { background: #222; }
    .cal-filter-clear { background: transparent; border: 1px solid var(--border); border-radius: 9px; padding: 8px 12px; color: var(--muted); font-family: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .cal-filter-clear:active { border-color: var(--accent); color: var(--accent); }

    .month-nav { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 4px; }
    .month-label { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: .5px; }
    .month-btn { width: 36px; height: 36px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .month-btn:active { border-color: var(--accent); }

    .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; padding: 4px 14px 8px; }
    .cal-dow { text-align: center; font-size: 10px; font-weight: 600; color: var(--muted); padding: 4px 0; letter-spacing: .5px; text-transform: uppercase; }
    .cal-day { aspect-ratio: 1; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; gap: 2px; }
    .cal-day:active { background: var(--surface2); }
    .cal-day.other-month .cal-day-num { color: #444; }
    .cal-day.today .cal-day-num { background: var(--accent); color: white; border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; }
    .cal-day.selected { background: rgba(255,107,53,.12); border: 1px solid rgba(255,107,53,.3); }
    .cal-day-num { font-size: 13px; font-weight: 500; line-height: 1; }
    .cal-dots { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; max-width: 28px; }
    .cal-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .dot-nova      { background: #90CAF9; }
    .dot-probiha   { background: #FFAB76; }
    .dot-dokoncena { background: #A5D6A7; }
    .dot-ceka      { background: #FFE082; }

    .cal-divider { padding: 10px 16px 4px; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); border-top: 1px solid var(--border); margin-top: 4px; }
    .cal-task-card { margin: 0 14px 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; cursor: pointer; }
    .cal-task-card:active { border-color: var(--accent); background: var(--surface2); }
    .cal-task-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .cal-task-date { font-size: 12px; color: var(--muted); flex-shrink: 0; }
    .cal-task-title { font-weight: 600; font-size: 15px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cal-task-path { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cal-task-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
    .cal-task-price { font-size: 13px; color: var(--accent); font-weight: 600; }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>
<div id="loading"><div class="loading-logo"><b>Kotlo</b>CRM</div><div class="loading-dot"></div></div>
<div id="app"></div>
<input type="file" id="photoInput" accept="image/*" capture="environment" multiple style="display:none">
<input type="file" id="importInput" accept=".zip" style="display:none">

<script>
'use strict';
const APP_VERSION = '1.3.0'; // bump při každém nasazení

// ══════════════════════════════════════════════════════
// OPFS
// ══════════════════════════════════════════════════════

const OPFS = {
  _root: null,
  async init() {
    this._root = await navigator.storage.getDirectory();
    const p = await this._root.getDirectoryHandle('photos', { create: true });
    for (const s of ['customers','locations','devices','tasks'])
      await p.getDirectoryHandle(s, { create: true });
  },
  async _dir(sub) {
    const p = await this._root.getDirectoryHandle('photos');
    return p.getDirectoryHandle(sub, { create: true });
  },
  async write(sub, fname, data) {
    const dir = await this._dir(sub);
    const fh  = await dir.getFileHandle(fname, { create: true });
    const wr  = await fh.createWritable();
    await wr.write(data); await wr.close();
    return `${sub}/${fname}`;
  },
  async readBlob(path) {
    const [s,f] = path.split('/');
    return (await (await this._dir(s)).getFileHandle(f)).getFile();
  },
  async del(path) {
    try { const [s,f]=path.split('/'); await (await this._dir(s)).removeEntry(f); } catch {}
  },
  async listAll() {
    const res=[], p=await this._root.getDirectoryHandle('photos');
    for await (const [s,dh] of p.entries()) {
      if (dh.kind!=='directory') continue;
      for await (const [f,fh] of dh.entries())
        if (fh.kind==='file') res.push({ path:`${s}/${f}`, handle:fh });
    }
    return res;
  }
};

// ══════════════════════════════════════════════════════
// PHOTO CACHE
// ══════════════════════════════════════════════════════

const PC = Object.create(null);
async function resolveURL(path) {
  if (!path) return '';
  if (PC[path]) return PC[path];
  try { return (PC[path] = URL.createObjectURL(await OPFS.readBlob(path))); } catch { return ''; }
}
async function resolveURLs(paths) { return Promise.all((paths||[]).map(resolveURL)); }
function clearCache() {
  for (const u of Object.values(PC)) try { URL.revokeObjectURL(u); } catch {}
  for (const k of Object.keys(PC)) delete PC[k];
}

// ══════════════════════════════════════════════════════
// INDEXEDDB
// Schema: customers → locations → devices → tasks
// ══════════════════════════════════════════════════════

let db;
function openDB() {
  return new Promise((res,rej) => {
    const req = indexedDB.open('kotlocrm_v2', 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      d.createObjectStore('customers', { keyPath:'id', autoIncrement:true });

      const ls = d.createObjectStore('locations', { keyPath:'id', autoIncrement:true });
      ls.createIndex('customerId','customerId');

      const ds = d.createObjectStore('devices', { keyPath:'id', autoIncrement:true });
      ds.createIndex('locationId','locationId');
      ds.createIndex('customerId','customerId');

      const ts = d.createObjectStore('tasks', { keyPath:'id', autoIncrement:true });
      ts.createIndex('deviceId','deviceId');
      ts.createIndex('customerId','customerId');
    };
    req.onsuccess = () => { db=req.result; res(); };
    req.onerror  = () => rej(req.error);
  });
}

const DB = {
  get:    (s,id)  => new Promise((r,j)=>{ const q=db.transaction(s).objectStore(s).get(id); q.onsuccess=()=>r(q.result); q.onerror=()=>j(q.error); }),
  all:    (s)     => new Promise((r,j)=>{ const q=db.transaction(s).objectStore(s).getAll(); q.onsuccess=()=>r(q.result||[]); q.onerror=()=>j(q.error); }),
  idx:    (s,i,v) => new Promise((r,j)=>{ const q=db.transaction(s).objectStore(s).index(i).getAll(v); q.onsuccess=()=>r(q.result||[]); q.onerror=()=>j(q.error); }),
  put:    (s,it)  => new Promise((r,j)=>{ const q=db.transaction(s,'readwrite').objectStore(s).put(it); q.onsuccess=()=>r(q.result); q.onerror=()=>j(q.error); }),
  del:    (s,id)  => new Promise((r,j)=>{ const q=db.transaction(s,'readwrite').objectStore(s).delete(id); q.onsuccess=()=>r(); q.onerror=()=>j(q.error); }),
  delIdx: async(s,i,v) => { for(const x of await DB.idx(s,i,v)) await DB.del(s,x.id); }
};

function esc(s) { return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(d) { return d?new Date(d).toLocaleDateString('cs-CZ'):'—'; }
function fmtPrice(p) { return p?Number(p).toLocaleString('cs-CZ')+'&nbsp;Kč':'—'; }
const STATUS = { nova:'Nová', probiha:'Probíhá', dokoncena:'Dokončena', ceka:'Čeká na díl' };

function toast(msg) {
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2400);
}
function showLightbox(src) {
  const lb=document.createElement('div'); lb.className='lightbox';
  lb.innerHTML=`<img src="${src}"><button class="lb-close" onclick="this.parentElement.remove()">✕</button>`;
  lb.addEventListener('click',e=>{if(e.target===lb)lb.remove();});
  document.body.appendChild(lb);
}
async function compressToBlob(file) {
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=1200,ratio=Math.min(MAX/img.width,MAX/img.height,1);
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*ratio); c.height=Math.round(img.height*ratio);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        c.toBlob(b=>res(b),'image/jpeg',.75);
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  });
}

}

document.getElementById('photoInput').addEventListener('change', async e=>{
  for (const file of Array.from(e.target.files)) {
    const blob=await compressToBlob(file);
    S.editPhotos.push({src:URL.createObjectURL(blob),blob,path:null,isNew:true});
  }
  e.target.value='';
  const el=document.getElementById('photos-edit-group');
  if(el){const tmp=document.createElement('div');tmp.innerHTML=photoEditHtml();el.replaceWith(tmp.firstChild);}
  else render();
});

function photoEditHtml() {
  return `<div class="form-group" id="photos-edit-group">
    <div class="form-label">Fotky (${S.editPhotos.length})</div>
    <div class="photos-scroll">
      ${S.editPhotos.map((p,i)=>`
        <div class="photo-edit-wrap">
          <img src="${esc(p.src)}" class="photo-edit-thumb" onclick="showLightbox('${esc(p.src)}')">
          <div class="photo-del" onclick="removeEditPhoto(${i})">✕</div>
        </div>`).join('')}
      <div class="photo-add" onclick="document.getElementById('photoInput').click()">＋</div>
    </div>
  </div>`;
}
function removeEditPhoto(i) {
  const p=S.editPhotos[i]; if(p.src.startsWith('blob:'))URL.revokeObjectURL(p.src);
  S.editPhotos.splice(i,1);
  const el=document.getElementById('photos-edit-group');
  if(el){const tmp=document.createElement('div');tmp.innerHTML=photoEditHtml();el.replaceWith(tmp.firstChild);}
  else render();
}
function photoDisplayHtml(urls) {
  if(!urls?.length) return '';
  return `<div class="photos-scroll">${urls.map(u=>u?`<img src="${esc(u)}" class="photo-thumb" onclick="showLightbox('${esc(u)}')">`:'').join('')}</div>`;
}
async function savePhotos(sub, id, editPhotos, oldPaths) {
  const kept=new Set(editPhotos.filter(p=>!p.isNew).map(p=>p.path));
  for (const op of (oldPaths||[])) if(!kept.has(op)) await OPFS.del(op);
  const res=[];
  for (const p of editPhotos) {
    if (!p.isNew){res.push(p.path);continue;}
    res.push(await OPFS.write(sub,`${sub.slice(0,-1)}_${id}_${Date.now()}_${res.length}.jpg`,p.blob));
  }
  return res;
}

async function deleteCustomer(id) {
  if(!confirm('Smazat zákazníka a vše co k němu patří?')) return;
  const c=await DB.get('customers',id); for(const p of(c?.photos||[])) await OPFS.del(p);
  for(const l of await DB.idx('locations','customerId',id)) {
    for(const p of(l.photos||[])) await OPFS.del(p);
    for(const d of await DB.idx('devices','locationId',l.id)) {
      for(const p of(d.photos||[])) await OPFS.del(p);
      for(const t of await DB.idx('tasks','deviceId',d.id)) { for(const p of(t.photos||[])) await OPFS.del(p); await DB.del('tasks',t.id); }
      await DB.del('devices',d.id);
    }
    await DB.del('locations',l.id);
  }
  await DB.del('customers',id); toast('Zákazník smazán'); nav('customers',{customerId:null});
}

async function deleteLocation(id) {
  if(!confirm('Smazat lokaci a vše co k ní patří?')) return;
  const l=await DB.get('locations',id); for(const p of(l?.photos||[])) await OPFS.del(p);
  for(const d of await DB.idx('devices','locationId',id)) {
    for(const p of(d.photos||[])) await OPFS.del(p);
    for(const t of await DB.idx('tasks','deviceId',d.id)) { for(const p of(t.photos||[])) await OPFS.del(p); await DB.del('tasks',t.id); }
    await DB.del('devices',d.id);
  }
  await DB.del('locations',id); toast('Lokace smazána'); nav('customer-detail',{locationId:null});
}

async function saveTask() {
  const date=document.getElementById('f-date')?.value; if(!date){toast('❗ Zadej datum');return;}
  const now=new Date().toISOString(), ex=S.taskId?await DB.get('tasks',S.taskId):null;
  const priceRaw=document.getElementById('f-price')?.value?.trim();
  const item={deviceId:ex?.deviceId||S.deviceId, locationId:ex?.locationId||S.locationId, customerId:ex?.customerId||S.customerId, date, title:document.getElementById('f-title')?.value?.trim()||'', status:document.getElementById('f-status')?.value||'nova', repairType:document.getElementById('f-repairType')?.value||'', description:document.getElementById('f-description')?.value?.trim()||'', parts:document.getElementById('f-parts')?.value?.trim()||'', price:priceRaw?Number(priceRaw):null, nextService:document.getElementById('f-nextService')?.value||'', notes:document.getElementById('f-notes')?.value?.trim()||'', photos:ex?.photos||[], createdAt:ex?.createdAt||now, updatedAt:now};
  if(S.taskId) item.id=S.taskId;
  if(ex?.gcalEventId) item.gcalEventId=ex.gcalEventId;
  const id=await DB.put('tasks',item);
  const savedItem={...item,id,photos:await savePhotos('tasks',id,S.editPhotos,ex?.photos||[])};
  await DB.put('tasks',savedItem);
  S.taskId=id;
  if(localStorage.getItem('gcal_enabled')) {
    try {
      const gcalEventId=await gcalCreateOrUpdateEvent(savedItem);
      if(gcalEventId && gcalEventId!==savedItem.gcalEventId)
        await DB.put('tasks',{...savedItem,gcalEventId});
    } catch(e){toast('⚠ Google Kalendář: '+e.message);}
  }
  toast(ex?'✓ Zakázka uložena':'✓ Zakázka přidána'); nav('task-detail');
}
async function deleteTask(id) {
  if(!confirm('Smazat zakázku?')) return;
  const t=await DB.get('tasks',id); for(const p of(t?.photos||[])) await OPFS.del(p);
  if(localStorage.getItem('gcal_enabled') && t?.gcalEventId) await gcalDeleteEvent(t.gcalEventId);
  await DB.del('tasks',id); toast('Zakázka smazána'); nav('device-detail',{taskId:null});
}

// ══════════════════════════════════════════════════════
// CALENDAR

async function renderCalendar() {
  const c = S.cal;
  const allTasks     = await DB.all('tasks');
  const allCustomers = await DB.all('customers');
  const allLocations = await DB.all('locations');
  const allDevices   = await DB.all('devices');

  const custMap = Object.fromEntries(allCustomers.map(x=>[x.id,x]));
  const locMap  = Object.fromEntries(allLocations.map(x=>[x.id,x]));
  const devMap  = Object.fromEntries(allDevices.map(x=>[x.id,x]));

  const filterCusts = allCustomers.sort((a,b)=>custDisplayName(a).localeCompare(custDisplayName(b),'cs'));
  const filterLocs  = allLocations.filter(l => !c.filterCustomerId || l.customerId==c.filterCustomerId)
    .sort((a,b)=>(a.address||'').localeCompare(b.address||'','cs'));
  const filterDevs  = allDevices.filter(d => {
    if (c.filterLocationId && d.locationId!=c.filterLocationId) return false;
    if (c.filterCustomerId && d.customerId!=c.filterCustomerId) return false;
    return true;
  }).sort((a,b)=>(a.name||a.type||'').localeCompare(b.name||b.type||'','cs'));

  let filtered = allTasks.filter(t => {
    if (c.filterCustomerId && t.customerId!=c.filterCustomerId) return false;
    if (c.filterLocationId && t.locationId!=c.filterLocationId) return false;
    if (c.filterDeviceId   && t.deviceId!=c.filterDeviceId)     return false;
    if (c.filterStatus     && t.status!==c.filterStatus)         return false;
    return true;
  });

  const dateMap = {};
  for (const t of filtered) {
    if (!t.date) continue;
    if (!dateMap[t.date]) dateMap[t.date] = [];
    dateMap[t.date].push(t);
  }

  const year=c.year, month=c.month;
  const firstDay = new Date(year, month, 1);
  const lastDay  = new Date(year, month+1, 0);
  let startDow = (firstDay.getDay()+6)%7;
  const MONTHS_CS = ['Leden','Únor','Březen','Duben','Květen','Červen','Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
  const DOW = ['Po','Út','St','Čt','Pá','So','Ne'];
  const todayStr = new Date().toISOString().split('T')[0];

  let cells = '';
  for (let i=0;i<startDow;i++) {
    const d = new Date(year,month,1-startDow+i);
    const ds = d.toISOString().split('T')[0];
    cells += calCell(ds, d.getDate(), true, dateMap, c.selectedDate, todayStr);
  }
  for (let d=1;d<=lastDay.getDate();d++) {
    const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells += calCell(ds, d, false, dateMap, c.selectedDate, todayStr);
  }
  const remaining = (7 - (startDow+lastDay.getDate())%7) % 7;
  for (let i=1;i<=remaining;i++) {
    const d = new Date(year,month+1,i);
    const ds = d.toISOString().split('T')[0];
    cells += calCell(ds, i, true, dateMap, c.selectedDate, todayStr);
  }

  let listTasks = c.selectedDate ? (dateMap[c.selectedDate]||[]) : filtered;
  listTasks = [...listTasks].sort((a,b)=>(a.date||'').localeCompare(b.date||''));

  const now = todayStr;
  const upcoming = listTasks.filter(t=>t.date>=now);
  const past     = listTasks.filter(t=>t.date<now).reverse();

  function taskCard(t) {
    const st=t.status||'nova';
    const dev=devMap[t.deviceId], loc=locMap[t.locationId], cust=custMap[t.customerId];
    const path=[cust?custDisplayName(cust):null, loc?.address, dev?.name||dev?.type].filter(Boolean).join(' › ');
    return `<div class="cal-task-card s-${st}" onclick="openTaskFromCalendar(${t.id})">
      <div class="cal-task-top">
        <div class="cal-task-date">${fmtDate(t.date)}</div>
        <div class="cal-task-title">${esc(t.title||'Zakázka')}</div>
        <span class="badge badge-${st}" style="font-size:11px;padding:2px 8px">${STATUS[st]||st}</span>
      </div>
      <div class="cal-task-path">${esc(path)}</div>
      ${(t.price||t.repairType)?`<div class="cal-task-bottom">
        <span style="font-size:12px;color:var(--muted)">${esc(t.repairType||'')}</span>
        ${t.price?`<span class="cal-task-price">${Number(t.price).toLocaleString('cs-CZ')} Kč</span>`:''}
      </div>`:''}
    </div>`;
  }

  const hasFilter = c.filterCustomerId||c.filterLocationId||c.filterDeviceId||c.filterStatus;
  const selectedLabel = c.selectedDate
    ? `${new Date(c.selectedDate+'T12:00:00').toLocaleDateString('cs-CZ',{day:'numeric',month:'long'})}`
    : 'Vše';

  return `
    <div class="header">
      <div style="width:44px"></div>
      <div class="header-title">📅 Kalendář</div>
      <button class="btn-icon accent" onclick="showBackupPanel()" title="Záloha">⇅</button>
    </div>
    <div class="scroll" style="padding-bottom:70px">

      <div class="cal-filters">
        <div class="cal-filter-row">
          <select class="cal-filter-select" onchange="S.cal.filterCustomerId=this.value;S.cal.filterLocationId='';S.cal.filterDeviceId='';render()">
            <option value="">Všichni zákazníci</option>
            ${filterCusts.map(x=>`<option value="${x.id}" ${c.filterCustomerId==x.id?'selected':''}>${esc(x.name)}</option>`).join('')}
          </select>
          <select class="cal-filter-select" onchange="S.cal.filterStatus=this.value;render()">
            <option value="">Všechny stavy</option>
            ${Object.entries(STATUS).map(([v,l])=>`<option value="${v}" ${c.filterStatus===v?'selected':''}>${l}</option>`).join('')}
          </select>
        </div>
        <div class="cal-filter-row">
          <select class="cal-filter-select" onchange="S.cal.filterLocationId=this.value;S.cal.filterDeviceId='';render()">
            <option value="">Všechny lokace</option>
            ${filterLocs.map(x=>`<option value="${x.id}" ${c.filterLocationId==x.id?'selected':''}>${esc(x.address)}${x.city?', '+x.city:''}</option>`).join('')}
          </select>
          <select class="cal-filter-select" onchange="S.cal.filterDeviceId=this.value;render()">
            <option value="">Všechna zařízení</option>
            ${filterDevs.map(x=>`<option value="${x.id}" ${c.filterDeviceId==x.id?'selected':''}>${esc(x.name||x.type)}</option>`).join('')}
          </select>
        </div>
        ${hasFilter||c.selectedDate?`<div style="display:flex;justify-content:flex-end">
          <button class="cal-filter-clear" onclick="S.cal.filterCustomerId='';S.cal.filterLocationId='';S.cal.filterDeviceId='';S.cal.filterStatus='';S.cal.selectedDate=null;render()">✕ Zrušit filtry</button>
        </div>`:''}
      </div>

      <div class="month-nav">

function calCell(ds, dayNum, otherMonth, dateMap, selectedDate, todayStr) {
  const tasks = dateMap[ds]||[];
  const dots  = tasks.slice(0,4).map(t=>`<div class="cal-dot dot-${t.status||'nova'}"></div>`).join('');
  const cls   = [
    'cal-day',
    otherMonth?'other-month':'',
    ds===todayStr?'today':'',
    ds===selectedDate?'selected':''
  ].filter(Boolean).join(' ');
  return `<div class="${cls}" onclick="calSelectDate('${ds}')">
    <div class="cal-day-num">${dayNum}</div>
    ${dots?`<div class="cal-dots">${dots}</div>`:''}
  </div>`;
}

function calSelectDate(ds) {
  S.cal.selectedDate = S.cal.selectedDate===ds ? null : ds;
  render();
}
function calPrevMonth() {
  if(S.cal.month===0){S.cal.month=11;S.cal.year--;}else S.cal.month--;
  S.cal.selectedDate=null; render();
}
function calNextMonth() {
  if(S.cal.month===11){S.cal.month=0;S.cal.year++;}else S.cal.month++;
  S.cal.selectedDate=null; render();
}

async function openTaskFromCalendar(taskId) {
  const t=await DB.get('tasks',taskId);
  if(!t) return;
  S.customerId=t.customerId; S.locationId=t.locationId; S.deviceId=t.deviceId; S.taskId=taskId;
  S._customer=await DB.get('customers',t.customerId);
  S._location=await DB.get('locations',t.locationId);
  S._device  =await DB.get('devices',  t.deviceId);
  S.tab='customers';
  S.view='task-detail';
  clearCache();
  document.getElementById('app').innerHTML = await renderTaskDetail() + bottomNav();
}

async function exportBackup(mode) {
  try {
    if(typeof JSZip==='undefined'){toast('❗ JSZip se načítá');return;}
    setProgress(5,'Načítám záznamy…');
    const [customers,locations,devices,tasks]=await Promise.all([DB.all('customers'),DB.all('locations'),DB.all('devices'),DB.all('tasks')]);
    setProgress(15,'Čtu fotky z disku…');
    const allFiles=await OPFS.listAll();
    const zip=new JSZip(), pf=zip.folder('photos');
    let loaded=0;
    for(const {path,handle} of allFiles){
      const file=await handle.getFile();
      pf.file(path,new Uint8Array(await file.arrayBuffer()),{binary:true});
      loaded++;
      setProgress(15+Math.round(loaded/Math.max(allFiles.length,1)*55),`Fotky… ${loaded}/${allFiles.length}`);
    }
    setProgress(72,'Sestavuji data.json…');
    zip.file('data.json',JSON.stringify({
      version:4,format:'zip-opfs-v1',exportedAt:new Date().toISOString(),app:'KotloCRM',
      counts:{customers:customers.length,locations:locations.length,devices:devices.length,tasks:tasks.length,photos:allFiles.length},
      data:{customers,locations,devices,tasks}
    },null,2));
    setProgress(80,'Generuji ZIP…');
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}},
      m=>setProgress(80+Math.round(m.percent*.18),`Komprimuji… ${Math.round(m.percent)}%`));
    const date=new Date().toISOString().split('T')[0];
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=`kotlocrm-zaloha-${date}.zip`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    const mb=(blob.size/1024/1024).toFixed(1);
    setProgress(100,`✓ Hotovo – ${customers.length} zákazníků, ${devices.length} zařízení, ${tasks.length} zakázek, ${allFiles.length} fotek, ${mb} MB`);
    toast(`✓ Záloha uložena (${mb} MB)`);
    if(mode==='gdrive') setTimeout(()=>window.open('https://drive.google.com/drive/my-drive','_blank'),1200);
    setTimeout(()=>document.getElementById('backup-overlay')?.remove(),3500);
  } catch(e){console.error(e);toast('❗ Export selhal: '+e.message);}
}

async function importBackup(file) {
  try {
    if(!file.name.endsWith('.zip')){toast('❗ Vyber .zip soubor');return;}
    if(typeof JSZip==='undefined'){toast('❗ JSZip se načítá');return;}
    setProgress(5,'Čtu ZIP…');
    const zip=await JSZip.loadAsync(await file.arrayBuffer());
    setProgress(15,'Načítám data.json…');
    const jf=zip.file('data.json'); if(!jf){toast('❗ Chybí data.json');return;}
    const backup=JSON.parse(await jf.async('string'));
    if(!backup?.data?.customers){toast('❗ Neplatný soubor');return;}

    const blobs={};
    const photoKeys=Object.keys(zip.files).filter(n=>n.startsWith('photos/')&&!zip.files[n].dir);
    let i=0;
    for(const full of photoKeys){
      const rel=full.replace(/^photos\//,'');
      blobs[rel]=new Blob([await zip.files[full].async('uint8array')],{type:full.endsWith('.png')?'image/png':'image/jpeg'});
      i++; setProgress(15+Math.round(i/Math.max(photoKeys.length,1)*30),`Fotky… ${i}/${photoKeys.length}`);
    }

    const {customers=[],locations=[],devices=[],tasks=[]}=backup.data;
    const cMap={},lMap={},dMap={};

    async function writePhotos(oldPaths,sub,newId){
      const res=[];
      for(const op of(oldPaths||[])){
        const blob=blobs[op]; if(!blob)continue;
        const ext=blob.type==='image/png'?'png':'jpg';
        res.push(await OPFS.write(sub,`${sub.slice(0,-1)}_${newId}_${Date.now()}_${res.length}.${ext}`,blob));
      }
      return res;
    }

    setProgress(50,'Zákazníci…');
    for(const c of customers){
      const oldId=c.id,nc={...c,photos:[]};delete nc.id;
      const newId=await DB.put('customers',nc);
      await DB.put('customers',{...nc,id:newId,photos:await writePhotos(c.photos,'customers',newId)});
      cMap[oldId]=newId;
    }
    setProgress(63,'Lokace…');
    for(const l of locations){
      const oldId=l.id,nl={...l,customerId:cMap[l.customerId]||l.customerId,photos:[]};delete nl.id;
      const newId=await DB.put('locations',nl);
      await DB.put('locations',{...nl,id:newId,photos:await writePhotos(l.photos,'locations',newId)});
      lMap[oldId]=newId;
    }
    setProgress(76,'Zařízení…');
    for(const d of devices){
      const oldId=d.id,nd={...d,locationId:lMap[d.locationId]||d.locationId,customerId:cMap[d.customerId]||d.customerId,photos:[]};delete nd.id;
      const newId=await DB.put('devices',nd);
      await DB.put('devices',{...nd,id:newId,photos:await writePhotos(d.photos,'devices',newId)});
      dMap[oldId]=newId;
    }
    setProgress(88,'Zakázky…');
    for(const t of tasks){
      const nt={...t,deviceId:dMap[t.deviceId]||t.deviceId,locationId:lMap[t.locationId]||t.locationId,customerId:cMap[t.customerId]||t.customerId,photos:[]};delete nt.id;
      const newId=await DB.put('tasks',nt);
      await DB.put('tasks',{...nt,id:newId,photos:await writePhotos(t.photos,'tasks',newId)});
    }
    setProgress(100,`✓ ${customers.length} zákazníků, ${devices.length} zařízení, ${tasks.length} zakázek`);
    toast(`✓ Import hotov – ${customers.length} zákazníků`);
    setTimeout(()=>{document.getElementById('backup-overlay')?.remove();nav('customers');},2000);
  } catch(e){console.error(e);toast('❗ Import selhal: '+(e.message||'Neplatný soubor'));}
}

document.getElementById('importInput').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;e.target.value='';
  if(!document.getElementById('backup-overlay'))showBackupPanel();

async function checkForUpdate() {
  if(!('serviceWorker' in navigator)){toast('❗ Service Worker není k dispozici');return;}
  const reg=await navigator.serviceWorker.getRegistration();
  if(!reg?.active){location.reload();return;}
  toast('🔄 Kontroluji aktualizaci…');
  // ask SW to clear cached index.html, then reload
  await new Promise(resolve=>{
    const ch=new MessageChannel();
    ch.port1.onmessage=()=>resolve();
    reg.active.postMessage('CLEAR_APP_CACHE',[ch.port2]);
    setTimeout(resolve,2000); // fallback
  });
  location.reload();
}

// ── Token cache ──────────────────────────────────────
let _driveTokenCache=null; // { value, expiresAt }
let _driveTokenClient=null;

function _getDriveTokenClient() {
  if(_driveTokenClient) return _driveTokenClient;
  const clientId=gdriveClientId(); if(!clientId) return null;
  _driveTokenClient=google.accounts.oauth2.initTokenClient({
    client_id:clientId,
    scope:'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/calendar',
    prompt:'select_account',
    callback:()=>{},
  });
  return _driveTokenClient;
}

function getDriveToken() {
  if(_driveTokenCache && _driveTokenCache.expiresAt>Date.now()+60000)
    return Promise.resolve(_driveTokenCache.value);
  return new Promise((resolve,reject)=>{
    const client=_getDriveTokenClient();
    if(!client){reject(new Error('Chybí Client ID'));return;}
    client.callback=(resp)=>{
      if(resp.error){reject(new Error(resp.error));return;}
      _driveTokenCache={value:resp.access_token,expiresAt:Date.now()+(resp.expires_in||3600)*1000};
      resolve(_driveTokenCache.value);
    };
    client.requestAccessToken({prompt:''});
  });
}

// ── Drive API helpers ────────────────────────────────
async function _driveReq(token,method,url,body,contentType) {
  const headers={Authorization:'Bearer '+token};
  if(contentType) headers['Content-Type']=contentType;
  const res=await fetch(url,{method,headers,body});
  if(!res.ok) throw new Error((await res.text()).slice(0,200));
  return res.status===204?null:res;
}

async function getDriveFolderId(token) {
  const cached=localStorage.getItem('gdrive_folder_id'); if(cached) return cached;
  const res=await _driveReq(token,'POST','https://www.googleapis.com/drive/v3/files',
    JSON.stringify({name:'KotloCRM',mimeType:'application/vnd.google-apps.folder'}),'application/json');
  const data=await res.json();
  localStorage.setItem('gdrive_folder_id',data.id);
  return data.id;
}

async function driveListFiles(token,folderId) {
  const q=encodeURIComponent(`'${folderId}' in parents and trashed=false`);
  const res=await _driveReq(token,'GET',
    `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&pageSize=1000`);
  const data=await res.json();
  const map={}; for(const f of data.files||[]) map[f.name]=f.id;
  return map; // { name: fileId }
}

async function driveUploadFile(token,folderId,name,blobOrBuf,mimeType,existingId) {
  const meta=existingId?{}:{name,parents:[folderId]};
  const form=new FormData();
  form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
  form.append('file',new Blob([blobOrBuf],{type:mimeType}));
  const url=existingId
    ?`https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=multipart&fields=id,size`
    :`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,size`;
  const res=await _driveReq(token,existingId?'PATCH':'POST',url,form);
  const data=await res.json();
  if(!data.id) throw new Error('Drive nevrátil fileId');
  return data.id; // confirmed by Drive
}

async function driveDeleteFile(token,fileId) {
  await _driveReq(token,'DELETE',`https://www.googleapis.com/drive/v3/files/${fileId}`);
}

async function driveDownloadFile(token,fileId) {
  const res=await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
    {headers:{Authorization:'Bearer '+token}});
  if(!res.ok) throw new Error((await res.text()).slice(0,200));
  return res.blob();
}

// ── Google Calendar sync ──────────────────────────────
function taskToGCalEvent(task,cust,loc,dev) {
  const custName=cust?custDisplayName(cust):'';
  const title=[custName,task.title||'Zakázka'].filter(Boolean).join(' – ');
  const desc=[
    custName?'Zákazník: '+custName:'',
    loc?'Lokace: '+(loc.address||''):'',
    dev?'Zařízení: '+(dev.name||dev.type||''):'',
    task.repairType?'Typ: '+task.repairType:'',
    task.description?'Popis: '+task.description:'',
    task.parts?'Díly: '+task.parts:'',
    task.price?'Cena: '+task.price+' Kč':'',
    task.notes?'Poznámky: '+task.notes:'',
  ].filter(Boolean).join('\n');
  const endDate=new Date(task.date); endDate.setDate(endDate.getDate()+1);
  const endStr=endDate.toISOString().split('T')[0];
  return {
    summary:title,
    description:desc,
    start:{date:task.date},
    end:{date:endStr},
    extendedProperties:{private:{kotlocrm_task_id:String(task.id||'')}},
  };
}

async function gcalCreateOrUpdateEvent(task) {
  if(!task.date) return null;
  const token=await getDriveToken();
  const [cust,loc,dev]=await Promise.all([
    task.customerId?DB.get('customers',task.customerId):Promise.resolve(null),
    task.locationId?DB.get('locations',task.locationId):Promise.resolve(null),
    task.deviceId?DB.get('devices',task.deviceId):Promise.resolve(null),
  ]);
  const event=taskToGCalEvent(task,cust,loc,dev);
  const base='https://www.googleapis.com/calendar/v3/calendars/primary/events';
  const res=task.gcalEventId
    ?await _driveReq(token,'PATCH',`${base}/${task.gcalEventId}`,JSON.stringify(event),'application/json')
    :await _driveReq(token,'POST',base,JSON.stringify(event),'application/json');
  const data=await res.json();
  return data.id||null;
}

async function gcalDeleteEvent(eventId) {
  if(!eventId) return;
  try {
    const token=await getDriveToken();
    await _driveReq(token,'DELETE',
      `https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`);
  } catch(e){/* event mohl být ručně smazán v GCal */}
}

// ── Push sync ────────────────────────────────────────
async function syncToDrive() {
  if(!gdriveClientId()){showGdriveSetup(true);return;}
  if(typeof google==='undefined'||!google?.accounts?.oauth2){toast('❗ Google API se načítá, zkus za chvíli');return;}
  if(!document.getElementById('backup-overlay')) showBackupPanel();
  try {
    setProgress(3,'Přihlašování ke Google…');
    const token=await getDriveToken();

    setProgress(8,'Načítám Drive složku…');
    const folderId=await getDriveFolderId(token);

    setProgress(14,'Načítám seznam souborů z Drive…');
    const driveFiles=await driveListFiles(token,folderId);

    setProgress(20,'Načítám lokální data…');
    const [customers,locations,devices,tasks]=await Promise.all(
      [DB.all('customers'),DB.all('locations'),DB.all('devices'),DB.all('tasks')]);
    const localFiles=await OPFS.listAll(); // [{path,handle}]
    const localPathSet=new Set(localFiles.map(f=>f.path));

    // photos: encode path (/ → |) for Drive filename
    const drivePhotos={}; // encodedName → fileId
    for(const [n,id] of Object.entries(driveFiles)) if(n!=='data.json') drivePhotos[n]=id;

    const toUpload=localFiles.filter(f=>!driveFiles[f.path.replace(/\//g,'|')]);
    const toDelete=Object.keys(drivePhotos).filter(n=>!localPathSet.has(n.replace(/\|/g,'/')));

    // upload new photos – continue on individual failures, collect errors
    let upOk=0; const upFailed=[];
    for(const {path,handle} of toUpload){
      try {
        const file=await handle.getFile();
        const driveName=path.replace(/\//g,'|');
        await driveUploadFile(token,folderId,driveName,await file.arrayBuffer(),
          file.name.endsWith('.png')?'image/png':'image/jpeg');
        upOk++;
      } catch(e){ upFailed.push(path); console.warn('Upload failed:',path,e.message); }
      setProgress(20+Math.round((upOk+upFailed.length)/Math.max(toUpload.length,1)*45),
        `Fotky… ${upOk+upFailed.length}/${toUpload.length}${upFailed.length?` ⚠${upFailed.length}`:''}`);
    }

    // delete removed photos – continue on individual failures
    let delOk=0; const delFailed=[];
    for(const name of toDelete){
      try { await driveDeleteFile(token,drivePhotos[name]); delOk++; }
      catch(e){ delFailed.push(name); console.warn('Delete failed:',name,e.message); }
      setProgress(65+Math.round((delOk+delFailed.length)/Math.max(toDelete.length,1)*10),
        `Mažu z Drive… ${delOk+delFailed.length}/${toDelete.length}`);
    }

    // upload data.json – critical, throws on failure
    setProgress(77,'Nahrávám data.json…');
    const dataJson=JSON.stringify({
      version:4,format:'drive-sync-v1',syncedAt:new Date().toISOString(),app:'KotloCRM',
      counts:{customers:customers.length,locations:locations.length,devices:devices.length,tasks:tasks.length,photos:localFiles.length},
      data:{customers,locations,devices,tasks}
    });
    await driveUploadFile(token,folderId,'data.json',
      new TextEncoder().encode(dataJson),'application/json',driveFiles['data.json']);

    localStorage.setItem('gdrive_last_sync',new Date().toISOString());
    const warn=upFailed.length||delFailed.length;
    const summary=`${customers.length} zákazníků, ${tasks.length} zakázek · ↑${upOk}/${toUpload.length} fotek`
      +(delOk||delFailed.length?` · ↓${delOk} smazáno`:'')
      +(warn?` · ⚠ ${upFailed.length+delFailed.length} chyb`:'');
    setProgress(100,(warn?'⚠ Sync s chybami – ':'✓ Sync hotov – ')+summary);
    toast(warn?`⚠ Sync dokončen, ${upFailed.length+delFailed.length} fotek selhalo`:'✓ Drive sync dokončen');
    setTimeout(()=>document.getElementById('backup-overlay')?.remove(),warn?6000:3500);
  } catch(e){console.error(e);toast('❗ Sync selhal: '+e.message);}
}

// ── Pull / restore ───────────────────────────────────
async function syncFromDrive() {
  if(!gdriveClientId()){showGdriveSetup(false);return;}
  if(typeof google==='undefined'||!google?.accounts?.oauth2){toast('❗ Google API se načítá, zkus za chvíli');return;}
  if(!document.getElementById('backup-overlay')) showBackupPanel();
  try {
    setProgress(5,'Přihlašování ke Google…');
    const token=await getDriveToken();

    const folderId=localStorage.getItem('gdrive_folder_id');
    if(!folderId){toast('❗ Drive nebyl ještě nakonfigurován – proveď nejdříve Sync.');return;}

    setProgress(15,'Načítám seznam souborů z Drive…');
    const driveFiles=await driveListFiles(token,folderId);
    if(!driveFiles['data.json']){toast('❗ Na Drive chybí data.json – proveď nejdříve Sync.');return;}

    setProgress(25,'Stahuji data.json…');
    const dataBlob=await driveDownloadFile(token,driveFiles['data.json']);
    const backup=JSON.parse(await dataBlob.text());
    if(!backup?.data?.customers){toast('❗ Neplatný soubor na Drive');return;}

    // confirmation dialog
    const syncDate=backup.syncedAt?new Date(backup.syncedAt).toLocaleString('cs-CZ',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'?';
    const c=backup.counts||{};
    const confirmed=await new Promise(resolve=>{
      const d=document.createElement('div');
      d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s';
      d.innerHTML=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:20px;width:100%;max-width:380px;padding:24px 20px 20px">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;margin-bottom:10px">Obnovit z <span style="color:var(--accent)">Drive</span>?</div>
        <div style="font-size:13px;color:var(--muted);line-height:1.8;margin-bottom:16px">
          Záloha z: <b style="color:var(--text)">${syncDate}</b><br>
          ${c.customers||0} zákazníků · ${c.devices||0} zařízení · ${c.tasks||0} zakázek · ${c.photos||0} fotek<br><br>
          <b style="color:#EF5350">Všechna lokální data budou nahrazena daty z Drive.</b>
        </div>
        <div style="display:flex;gap:8px">
          <button class="d-cancel" style="flex:0 0 auto;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-family:inherit;font-size:15px;cursor:pointer">Zrušit</button>
          <button class="d-ok" style="flex:1;background:#EF5350;color:#fff;border:none;border-radius:10px;padding:12px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer">Nahradit vše</button>
        </div>
      </div>`;
      document.body.appendChild(d);
      d.querySelector('.d-cancel').onclick=()=>{d.remove();resolve(false);};
      d.querySelector('.d-ok').onclick=()=>{d.remove();resolve(true);};
    });
    if(!confirmed) return;

    // clear local data
    setProgress(30,'Mažu lokální data…');
    clearCache();
    const localFiles=await OPFS.listAll();
    for(const {path} of localFiles) await OPFS.del(path);
    for(const store of ['tasks','devices','locations','customers']){
      const all=await DB.all(store);
      for(const item of all) await DB.del(store,item.id);
    }

    // download photos from Drive
    const photoEntries=Object.entries(driveFiles).filter(([n])=>n!=='data.json');
    let dl=0;
    for(const [driveName,fileId] of photoEntries){
      const opfsPath=driveName.replace(/\|/g,'/');
      const [sub,fname]=opfsPath.split('/');
      const blob=await driveDownloadFile(token,fileId);
      await OPFS.write(sub,fname,blob);
      dl++;
      setProgress(30+Math.round(dl/Math.max(photoEntries.length,1)*45),`Stahuji fotky… ${dl}/${photoEntries.length}`);
    }

    // insert records with original IDs (DB is empty so no conflicts)
    setProgress(78,'Obnovuji záznamy…');
    const {customers=[],locations=[],devices=[],tasks=[]}=backup.data;
    for(const c of customers) await DB.put('customers',c);
    for(const l of locations) await DB.put('locations',l);
    for(const d of devices) await DB.put('devices',d);
    for(const t of tasks) await DB.put('tasks',t);

    localStorage.setItem('gdrive_last_sync',new Date().toISOString());
    setProgress(100,`✓ Obnoveno – ${customers.length} zákazníků, ${devices.length} zařízení, ${tasks.length} zakázek`);
    toast('✓ Obnoveno z Drive');
    setTimeout(()=>{document.getElementById('backup-overlay')?.remove();nav('customers');},2000);
  } catch(e){console.error(e);toast('❗ Obnovení selhalo: '+e.message);}
}
